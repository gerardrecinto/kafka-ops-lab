[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-ops-lab"
version = "0.1.0"
description = "Kafka production-operations portfolio project: topic/partition design, idempotent consumers, retry/DLQ, schema validation, lag monitoring, and a reproducible partition-imbalance investigation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["kafka_ops_lab*"]
